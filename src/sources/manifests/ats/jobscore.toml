version = 1
id = "jobscore"
name = "JobScore"
family = "ats"
health = "requires_slug"
request = "https://careers.jobscore.com/jobs/{slug}/feed.json?sort=date&limit=25"
parser = "json"
fetcher = "plain"
pagination = "none"
profile = "none"
requires_js = false
requests_per_minute = 30
max_concurrency = 1
robots = "allow public job feed endpoints"
attribution = "JobScore"
slugs = ["example-co"]
fixtures = ["jobscore"]

[request_options.headers]
accept = "application/json"
user-agent = "Mozilla/5.0"

[field_aliases.title]
names = ["title"]

[field_aliases.company]
names = ["company_name", "company"]

[field_aliases.url]
names = ["detail_url", "url"]

[field_aliases.location]
names = ["location.city", "location.state", "location.country"]

[field_aliases.description]
names = ["description"]

