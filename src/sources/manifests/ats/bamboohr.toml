version = 1
id = "bamboohr"
name = "BambooHR"
family = "ats"
health = "working"
request = "https://{slug}.bamboohr.com/careers/list"
parser = "json"
fetcher = "plain"
pagination = "none"
profile = "none"
requires_js = false
requests_per_minute = 30
max_concurrency = 1
robots = "allow public career list endpoints"
attribution = "BambooHR"
slugs = ["401auto"]
fixtures = ["bamboohr"]

[request_options.headers]
accept = "application/json"
user-agent = "Mozilla/5.0"

[parser_options]
envelope = ["result"]
url_from = "id"
url_prefix = "https://401auto.bamboohr.com/careers/"

[field_aliases.title]
names = ["jobOpeningName"]

[field_aliases.company]
names = ["company"]

[field_aliases.url]
names = ["url", "jobUrl", "applyUrl"]

[field_aliases.location]
names = ["location.city", "location.state", "location.country"]

[field_aliases.description]
names = ["description"]

