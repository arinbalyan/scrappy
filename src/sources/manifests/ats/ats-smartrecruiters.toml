slugs = ["example-co"]
fixtures = ["ats-smartrecruiters"]

[field_aliases.title]
names = ["name"]

[field_aliases.company]
names = ["company.name", "company"]

[field_aliases.url]
names = ["ref", "url"]

[field_aliases.location]
names = ["location.city", "location.region", "location.country"]

[field_aliases.description]
names = ["jobAd.sections.jobDescription.text"]

[parser_options]
envelope = ["content"]
