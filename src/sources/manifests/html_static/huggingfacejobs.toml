version = 1
id = "huggingfacejobs"
name = "Hugging Face Jobs"
family = "html_static"
health = "working"
request = "https://apply.workable.com/api/v1/widget/accounts/huggingface"
parser = "json"
fetcher = "plain"
pagination = "none"
profile = "none"
requires_js = false
requests_per_minute = 20
max_concurrency = 2
robots = "allow"
attribution = "Hugging Face Jobs"
fixtures = ["huggingfacejobs"]

[parser_options]
envelope = ["jobs"]

[field_aliases.title]
names = ["title"]

[field_aliases.company]
names = ["company", "name"]

[field_aliases.url]
names = ["url", "shortlink"]

[field_aliases.location]
names = ["city", "locations.0.city"]

[field_aliases.description]
names = ["description"]
