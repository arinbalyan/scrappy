version = 1
id = "builtin"
name = "Built In"
family = "html_static"
health = "working"
request = "https://builtin.com/jobs?search={query:search}"
parser = "html"
fetcher = "plain"
pagination = "page:0:6"
profile = "none"
requires_js = false
requests_per_minute = 20
max_concurrency = 2
robots = "allow"
attribution = "Built In"
fixtures = ["builtin"]

[selectors]
item = "[data-id=job-card]"
title = "[data-id=job-card-title]"
company = "[data-id=company-title]"
url = "[data-id=job-card-title]"
url_attribute = "href"

[request_options.headers]
user-agent = "Mozilla/5.0"
