version = 1
id = "mycareersfuture"
name = "MyCareersFuture"
family = "feeds_api"
health = "working"
request = "https://api.mycareersfuture.gov.sg/v2/search"
parser = "json"
fetcher = "plain"
pagination = "none"
profile = "none"
requires_js = false
requests_per_minute = 20
max_concurrency = 1
robots = "allow public job search"
attribution = "MyCareersFuture"
fixtures = ["mycareersfuture"]

[request_options]
method = "POST"
body = '{{"limit":{query:limit},"keyword":"{query:keyword}"}}'

[request_options.headers]
content-type = "application/json"

[parser_options]
envelope = ["results"]

[field_aliases.title]
names = ["title"]

[field_aliases.company]
names = ["postedCompany.name", "company.name"]

[field_aliases.url]
names = ["metadata.jobDetailsUrl", "jobUrl"]

[field_aliases.location]
names = ["location"]

[field_aliases.description]
names = ["description"]
