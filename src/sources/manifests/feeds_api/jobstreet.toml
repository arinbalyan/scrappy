version = 1
id = "jobstreet"
name = "JobStreet"
family = "feeds_api"
health = "working"
request = "https://www.seek.com.au/api/jobsearch/v5/search?keywords={query:keywords}&page={query:page}&pagesize={query:pagesize}&siteKey=MY-Main&where={query:where}"
parser = "json"
fetcher = "plain"
pagination = "numbered pages"
profile = "none"
requires_js = false
requests_per_minute = 20
max_concurrency = 1
robots = "allow public job search"
attribution = "JobStreet"
fixtures = ["jobstreet"]

[parser_options]
envelope = ["data"]
url_from = "id"
url_prefix = "https://www.jobstreet.com.my/job/"

[field_aliases.title]
names = ["title"]

[field_aliases.company]
names = ["companyName", "advertiser.description"]

[field_aliases.url]
names = ["jobUrl"]

[field_aliases.location]
names = ["locations.0.label", "location"]

[field_aliases.description]
names = ["teaser"]

[query_defaults]
keywords = "engineer"
page = "1"
pagesize = "50"
where = "remote"
