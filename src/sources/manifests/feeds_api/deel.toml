version = 1
id = "deel"
name = "Deel"
family = "feeds_api"
health = "keyed"
request = "https://api.letsdeel.com/rest/v2/ats/job-postings?limit=25"
parser = "json"
fetcher = "plain"
pagination = "none"
profile = "none"
requires_js = false
requests_per_minute = 20
max_concurrency = 2
robots = "allow"
attribution = "Deel"
fixtures = ["deel"]

credentials = ["DEEL_API_TOKEN"]

[parser_options]
envelope = ["data"]

[field_aliases.url]
names = ["url", "apply_url"]

[field_aliases.title]
names = ["title"]

[field_aliases.company]
names = ["department"]

[field_aliases.location]
names = ["location.city", "location.country"]

[field_aliases.description]
names = ["description"]

