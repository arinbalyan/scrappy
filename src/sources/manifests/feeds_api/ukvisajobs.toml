version = 1
id = "ukvisajobs"
name = "UK Visa Jobs"
family = "feeds_api"
health = "working"
request = "https://www.ukvisajobs.com/"
parser = "json"
fetcher = "plain"
pagination = "none"
profile = "none"
requires_js = false
requests_per_minute = 12
max_concurrency = 1
robots = "allow"
attribution = "UK Visa Jobs"
fixtures = ["ukvisajobs"]

[request_options.headers]
user-agent = "Mozilla/5.0"

[parser_options]
embedded = { element_id = "__NEXT_DATA__", envelope = ["props", "pageProps", "result", "experienced_jobs"] }

[field_aliases.title]
names = ["title"]

[field_aliases.company]
names = ["company_name"]

[field_aliases.url]
names = ["job_link"]

[field_aliases.location]
names = ["city"]

[field_aliases.description]
names = ["description"]
