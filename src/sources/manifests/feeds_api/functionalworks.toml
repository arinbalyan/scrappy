version = 1
id = "functionalworks"
name = "Functional Works"
family = "feeds_api"
health = "working"
request = "https://functional.works-hub.com/api/graphql"
parser = "json"
fetcher = "plain"
pagination = "none"
profile = "none"
requires_js = false
requests_per_minute = 20
max_concurrency = 2
robots = "allow"
attribution = "Functional Works"
fixtures = ["functionalworks"]

[request_options]
method = "POST"
body = '{{"query":"{{ jobs(page_size:20, vertical:\"functional\", published:true) {{ title company {{ name }} location {{ city country }} remote remuneration {{ timePeriod competitive currency min max }} slug firstPublished descriptionHtml tags {{ label }} }} }}"}}'

[request_options.headers]
accept = "application/json"
content-type = "application/json"
user-agent = "Mozilla/5.0"

[parser_options]
envelope = ["data", "jobs"]

[field_aliases.url]
names = ["url"]

[field_aliases.title]
names = ["title"]

[field_aliases.company]
names = ["company.name"]

[field_aliases.location]
names = ["location.city"]

[field_aliases.description]
names = ["descriptionHtml"]
