name-template: 'scrappy v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'breaking-change'
  minor:
    labels:
      - 'enhancement'
      - 'feature'
  patch:
    labels:
      - 'bug'
      - 'documentation'
      - 'performance'
      - 'security'
      - 'dependencies'
  default: patch
template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ## Install

  ### Linux (x86_64)
  ```
  curl -fsSL https://github.com/$OWNER/$REPOSITORY/releases/download/v$RESOLVED_VERSION/scrappy_linux_amd64.tar.gz | tar xz
  sudo mv scrappy_linux_amd64 /usr/local/bin/scrappy
  ```

  ### macOS (Apple Silicon)
  ```
  curl -fsSL https://github.com/$OWNER/$REPOSITORY/releases/download/v$RESOLVED_VERSION/scrappy_darwin_arm64.tar.gz | tar xz
  sudo mv scrappy_darwin_arm64 /usr/local/bin/scrappy
  ```

  ### macOS (Intel)
  ```
  curl -fsSL https://github.com/$OWNER/$REPOSITORY/releases/download/v$RESOLVED_VERSION/scrappy_darwin_amd64.tar.gz | tar xz
  sudo mv scrappy_darwin_amd64 /usr/local/bin/scrappy
  ```

  ### Windows (PowerShell)
  ```powershell
  curl.exe -LO https://github.com/$OWNER/$REPOSITORY/releases/download/v$RESOLVED_VERSION/scrappy_windows_amd64.zip
  Expand-Archive scrappy_windows_amd64.zip -DestinationPath .
  .\scrappy_windows_amd64.exe --help
  ```

  ### Docker
  ```bash
  docker pull ghcr.io/$OWNER/$REPOSITORY:v$RESOLVED_VERSION
  ```

  ### From source
  ```bash
  git clone https://github.com/$OWNER/$REPOSITORY.git
  cd scrappy
  git checkout v$RESOLVED_VERSION
  go build ./cmd/scrappy/
  ```

categories:
  - title: 'Breaking Changes'
    labels:
      - 'breaking-change'
  - title: 'New Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'bug'
  - title: 'Performance Improvements'
    labels:
      - 'performance'
  - title: 'Documentation'
    labels:
      - 'documentation'
  - title: 'Dependency Updates'
    labels:
      - 'dependencies'
  - title: 'Infrastructure & CI'
    labels:
      - 'infrastructure'
      - 'ci'
  - title: 'Other Changes'
    labels:
      - '*'
