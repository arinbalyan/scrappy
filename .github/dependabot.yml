version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    target-branch: dev
    reviewers:
      - arinbalyan
    labels:
      - dependencies
      - enhancement
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope

  # Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - infrastructure
    commit-message:
      prefix: chore
      include: scope
