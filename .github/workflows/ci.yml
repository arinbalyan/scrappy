name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-test-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify modules
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  security-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks scan
        run: ./gitleaks detect --source . --verbose --redact

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build-test-vet, security-secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Compute next version
        id: version
        run: |
          git fetch --tags origin 2>/dev/null || true
          LAST=$(git tag --list 'v0.1.*' --sort=-v:refname 2>/dev/null | head -1)
          if [ -z "$LAST" ]; then
            echo "tag=v0.1.0" >> $GITHUB_OUTPUT
            echo "version=0.1.0" >> $GITHUB_OUTPUT
          else
            PATCH=$(echo "$LAST" | sed 's/^v0\.1\.//')
            NEXT=$((PATCH + 1))
            echo "tag=v0.1.${NEXT}" >> $GITHUB_OUTPUT
            echo "version=0.1.${NEXT}" >> $GITHUB_OUTPUT
          fi

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_linux_amd64 ./cmd/scrappy
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_darwin_arm64 ./cmd/scrappy
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_darwin_amd64 ./cmd/scrappy
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_windows_amd64.exe ./cmd/scrappy

      - name: Package release artifacts
        run: |
          cd dist
          tar czf scrappy_linux_amd64.tar.gz scrappy_linux_amd64
          tar czf scrappy_darwin_arm64.tar.gz scrappy_darwin_arm64
          tar czf scrappy_darwin_amd64.tar.gz scrappy_darwin_amd64
          zip scrappy_windows_amd64.zip scrappy_windows_amd64.exe

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: "scrappy ${{ steps.version.outputs.tag }}"
          body: |
            ## scrappy ${{ steps.version.outputs.version }}

            ### Install

            ```bash
            curl -fsSL "https://github.com/arinbalyan/scrappy/releases/download/v${{ steps.version.outputs.version }}/scrappy_linux_amd64.tar.gz" | tar xz && sudo mv scrappy_linux_amd64 /usr/local/bin/scrappy
            ```
            (See README.md for macOS and Windows install commands.)

            ### Changes

            Auto-generated release from push to main.
          artifacts: "dist/*.tar.gz,dist/*.zip"
          makeLatest: true
