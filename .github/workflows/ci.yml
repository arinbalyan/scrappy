name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --no-deps
      - run: cargo test --locked
      - name: Secret leak check
        run: |
          cargo build --locked
          sh scripts/check-secret-leaks.sh --self-test
          sh scripts/check-secret-leaks.sh target/debug/scrappy
      - run: cargo check --locked --features emulation
      - run: cargo check --locked --features browser
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check
  static:
    name: musl static smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify static linking
        run: |
          file target/x86_64-unknown-linux-musl/release/scrappy
          ldd target/x86_64-unknown-linux-musl/release/scrappy 2>&1 | grep -q "not a dynamic executable"
      - name: Smoke test
        run: target/x86_64-unknown-linux-musl/release/scrappy --help
      - name: Minimal container smoke test
        run: docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release/scrappy:/scrappy:ro" scratch /scrappy --version
