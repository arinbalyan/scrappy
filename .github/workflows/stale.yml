name: Stale Issue Management

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: >
            This issue has been inactive for 60 days. If it's still relevant, please
            comment or update it. Otherwise it will be closed in 14 days.
          stale-issue-label: stale
          exempt-issue-labels: 'critical,help wanted,good first issue,blocked'
          days-before-issue-stale: 60
          days-before-issue-close: 14

          # PRs
          stale-pr-message: >
            This PR has been inactive for 30 days. Please address review feedback or
            update it. It will be closed in 14 days if no activity.
          stale-pr-label: stale
          exempt-pr-labels: 'draft,blocked,work-in-progress'
          days-before-pr-stale: 30
          days-before-pr-close: 14

          # Labels created by this workflow
          labels-to-add-when-unstale: 'needs-review'
