name: PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  label-check:
    name: Label Requirements
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip for Dependabot
        uses: actions/github-script@v9
        with:
          script: |
            const isDependabot = context.payload.pull_request.user.login === 'app/dependabot';
            if (isDependabot) {
              core.info('Skipping label check for Dependabot PR');
              return;
            }

      - name: Check labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const requiredLabels = ['bug', 'enhancement', 'documentation', 'performance', 'chore', 'dependencies'];
            const hasRequired = labels.some(l => requiredLabels.includes(l));
            if (!hasRequired) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ⚠️ Missing Label\n\nThis PR doesn't have a type label. Please add one of: \`bug\`, \`enhancement\`, \`documentation\`, \`performance\`, \`chore\`, or \`dependencies\`.\n\n<sub>🤖 This check runs automatically when labels change.</sub>`
              });
              core.setFailed('PR is missing a type label (bug, enhancement, documentation, performance, chore, or dependencies)');
            }

  size-label:
    name: Size Label
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip for Dependabot
        uses: actions/github-script@v9
        with:
          script: |
            const isDependabot = context.payload.pull_request.user.login === 'app/dependabot';
            if (isDependabot) {
              core.info('Skipping size label for Dependabot PR');
              return;
            }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine PR size
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let additions = 0;
            let deletions = 0;
            for (const file of files) {
              additions += file.additions;
              deletions += file.deletions;
            }
            const total = additions + deletions;

            let sizeLabel;
            if (total > 1000) {
              sizeLabel = 'size: XL';
            } else if (total > 500) {
              sizeLabel = 'size: L';
            } else if (total > 100) {
              sizeLabel = 'size: M';
            } else if (total > 10) {
              sizeLabel = 'size: S';
            } else {
              sizeLabel = 'size: XS';
            }

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Remove existing size labels
            const sizeLabels = currentLabels.filter(l => l.name.startsWith('size: '));
            for (const label of sizeLabels) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name
              }).catch(() => {});
            }

            // Add new size label (create if needed)
            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [sizeLabel]
              });
            } catch (e) {
              // Label may not exist, create it
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: sizeLabel,
                color: 'BEBEBE',
                description: `PR size: ${total} changes`
              });
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [sizeLabel]
              });
            }

            core.info(`PR size: ${total} changes (${additions}+ / ${deletions}-) → ${sizeLabel}`);

  title-format:
    name: Title Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip for Dependabot
        uses: actions/github-script@v9
        with:
          script: |
            const isDependabot = context.payload.pull_request.user.login === 'app/dependabot';
            if (isDependabot) {
              core.info('Skipping title format check for Dependabot PR');
              return;
            }

      - name: Validate title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const patterns = [
              /^feat:/, /^fix:/, /^docs:/, /^perf:/, /^refactor:/,
              /^test:/, /^chore:/, /^ci:/, /^style:/, /^revert:/,
              /^chore\(deps\):/, /^ci\(deps\):/
            ];
            const valid = patterns.some(p => p.test(title));
            if (!valid) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ⚠️ Title Format\n\nThe PR title should follow conventional commits format:\n\n\`feat: ...\`, \`fix: ...\`, \`docs: ...\`, \`perf: ...\`, \`refactor: ...\`, \`chore: ...\`, \`ci: ...\`, \`chore(deps): ...\`, \`ci(deps): ...\`\n\nCurrent title: \`${title}\``
              });
              core.setFailed('PR title does not follow conventional commits format');
            }

  todo-check:
    name: TODO / FIXME Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for TODOs in diff
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const todoPattern = /(TODO|FIXME|HACK|XXX|BUG)/i;
            const findings = [];

            for (const file of files) {
              if (file.status === 'removed') continue;
              // Check the diff content for TODOs
              const patch = file.patch || '';
              const lines = patch.split('\n');
              for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('+') && todoPattern.test(lines[i])) {
                  findings.push(`  - \`${file.filename}\`: ${lines[i].trim().slice(0, 120)}`);
                }
              }
            }

            if (findings.length > 0) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔍 TODO / FIXME in this PR\n\nThe diff contains inline TODO/FIXME/HACK markers:\n\n${findings.join('\n')}\n\n<sub>🤖 If these are intentional, you can ignore this message.</sub>`
              });
            }
