name: promote

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC — auto promotes dev→beta→staging
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        type: choice
        options:
          - staging-to-main

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-promotions (daily cron, 7-day gate)
      - name: Promote dev → beta
        if: github.event_name == 'schedule'
        run: bash .github/scripts/promote.sh dev beta

      - name: Promote beta → staging
        if: github.event_name == 'schedule'
        run: bash .github/scripts/promote.sh beta staging

      # Manual: create PR from staging → main (no auto-merge)
      - name: Create PR staging → main
        if: github.event_name == 'workflow_dispatch' && inputs.step == 'staging-to-main'
        run: bash .github/scripts/promote.sh staging main --force --pr-only
