name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: Pre-release tag
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '-beta'
          - '-rc'

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Compute next version
        id: version
        run: |
          git fetch --tags origin 2>/dev/null || true

          BUMP="${{ inputs.version_bump }}"
          PRERELEASE="${{ inputs.prerelease }}"

          # Find the latest stable release tag
          LAST_STABLE=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LAST_STABLE" ]; then
            MAJOR=0
            MINOR=1
            PATCH=0
          else
            # Strip 'v' prefix
            STEM="${LAST_STABLE#v}"
            MAJOR=$(echo "$STEM" | cut -d. -f1)
            MINOR=$(echo "$STEM" | cut -d. -f2)
            PATCH=$(echo "$STEM" | cut -d. -f3)

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
          fi

          TAG="v${MAJOR}.${MINOR}.${PATCH}${PRERELEASE}"
          VER="${MAJOR}.${MINOR}.${PATCH}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Computed: ${TAG} from last stable ${LAST_STABLE:-none}"

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_linux_amd64 ./cmd/scrappy
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_darwin_arm64 ./cmd/scrappy
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_darwin_amd64 ./cmd/scrappy
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/scrappy_windows_amd64.exe ./cmd/scrappy

      - name: Package release artifacts
        run: |
          cd dist
          tar czf scrappy_linux_amd64.tar.gz scrappy_linux_amd64
          tar czf scrappy_darwin_arm64.tar.gz scrappy_darwin_arm64
          tar czf scrappy_darwin_amd64.tar.gz scrappy_darwin_amd64
          zip scrappy_windows_amd64.zip scrappy_windows_amd64.exe
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists - updating"
            git tag -fa "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}" --force
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: "scrappy ${{ steps.version.outputs.tag }}"
          body: |
            Release ${{ steps.version.outputs.tag }} of scrappy, the bulk job-board scraper for 100+ sites.

            ## Installation

            ### Linux (x86_64)

            ```bash
            curl -fsSL https://github.com/arinbalyan/scrappy/releases/download/${{ steps.version.outputs.tag }}/scrappy_linux_amd64.tar.gz | tar xz
            sudo mv scrappy_linux_amd64 /usr/local/bin/scrappy
            ```

            ### macOS (Apple Silicon)

            ```bash
            curl -fsSL https://github.com/arinbalyan/scrappy/releases/download/${{ steps.version.outputs.tag }}/scrappy_darwin_arm64.tar.gz | tar xz
            sudo mv scrappy_darwin_arm64 /usr/local/bin/scrappy
            ```

            ### macOS (Intel)

            ```bash
            curl -fsSL https://github.com/arinbalyan/scrappy/releases/download/${{ steps.version.outputs.tag }}/scrappy_darwin_amd64.tar.gz | tar xz
            sudo mv scrappy_darwin_amd64 /usr/local/bin/scrappy
            ```

            ### Windows (PowerShell)

            ```powershell
            curl.exe -LO https://github.com/arinbalyan/scrappy/releases/download/${{ steps.version.outputs.tag }}/scrappy_windows_amd64.zip
            Expand-Archive scrappy_windows_amd64.zip -DestinationPath .
            .\scrappy_windows_amd64.exe --help
            ```

            ### Checksums

            See SHA256SUMS.txt in the release assets.

            ## Changes

            See the [Release Drafter](https://github.com/arinbalyan/scrappy/releases) for a full changelog.
          artifacts: "dist/*.tar.gz,dist/*.zip,dist/SHA256SUMS.txt"
          makeLatest: ${{ inputs.prerelease == '' && 'true' || 'false' }}
          allowUpdates: true
          prerelease: ${{ inputs.prerelease != '' && 'true' || 'false' }}
