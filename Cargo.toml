[package]
name = "scrappy"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Installable job-source scraper with deterministic output"
repository = "https://github.com/arinbalyan/scrappy"
keywords = ["cli", "scraper", "jobs"]
categories = ["command-line-utilities"]

[[test]]
name = "cli_contract"
path = "tests/cli_contract/mod.rs"

[[test]]
name = "bridge_contract"
path = "tests/bridge_contract/mod.rs"

[features]
default = []
emulation = ["dep:wreq", "dep:wreq-util"]
browser = ["dep:chromiumoxide", "dep:futures"]
test-util = []

[dependencies]
clap = { version = "4.6.10", features = ["derive", "env"] }
clap_complete = "4.6.12"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip"] }
scraper = { version = "0.29.0", default-features = false }
quick-xml = { version = "0.42.0", features = ["serialize"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "io-util"] }
wreq = { version = "6.0.0-rc.31", optional = true, default-features = false, features = ["webpki-roots", "tokio-rt", "gzip"] }
wreq-util = { version = "3.0.0-rc.14", optional = true, features = ["emulation", "tokio-rt"] }
chromiumoxide = { package = "crawlberg-chromiumoxide", version = "0.10.0", optional = true, default-features = false, features = ["fetcher", "rustls", "zip8"] }
futures = { version = "0.3", optional = true, default-features = false, features = ["std"] }
governor = { version = "0.10", default-features = false, features = ["std"] }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
# Transitive dependency versions come from locked upstream crates.
multiple_crate_versions = "allow"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
literal_string_with_formatting_args = "allow"
