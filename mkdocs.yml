site_name: scrappy
site_description: Bulk job-board scraper for 100+ sites — LinkedIn, Indeed, ATS suites, and niche boards
site_url: https://arinbalyan.github.io/scrappy/
repo_url: https://github.com/arinbalyan/scrappy
repo_name: arinbalyan/scrappy

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Quickstart: 001-Quickstart.md
  - Installation: 003-Installation.md
  - CLI Reference: 004-CLI-Reference.md
  - Configuration: 008-Configuration.md
  - Architecture Overview: 002-Architecture-Overview.md
  - Interactive Mode: 005-Interactive-Mode.md
  - Non-Interactive Mode: 006-NonInteractive-Mode.md
  - Multi-Value Search: 007-Multi-Value.md
  - Export Formats: 009-Export-Formats.md
  - Email: 010-Email.md
  - Quality: 011-Quality.md
  - Scraping: 012-Scraping.md
  - Proxy: 013-Proxy.md
  - Dedup: 014-Dedup.md
  - Environment Variables: 015-Environment-Variables.md
  - Memory Management: 016-Memory-Management.md
  - Architecture Reference: 019-Architecture-Reference.md
  - Troubleshooting: 017-Troubleshooting.md
  - FAQ: 018-FAQ.md
  - Supported Sites:
    - All Sites: sites/README.md
