site_name: scrappy
site_description: Bulk job-board scraper for 100+ sites — LinkedIn, Indeed, ATS suites, and niche boards
site_url: https://arinbalyan.github.io/scrappy/
repo_url: https://github.com/arinbalyan/scrappy
repo_name: arinbalyan/scrappy

docs_dir: .

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji
  - attr_list
  - md_in_html

nav:
  - Home: README.md
  - Quickstart: docs/001-Quickstart.md
  - User Guide:
    - CLI Reference: docs/004-CLI-Reference.md
    - Configuration: docs/008-Configuration.md
    - Interactive Mode: docs/005-Interactive-Mode.md
    - Non-Interactive Mode: docs/006-NonInteractive-Mode.md
