# docker-compose.yml — bulk job scrape runner
# Usage:
#   docker compose up                           # run once (default)
#   docker compose --profile scheduled up -d    # daemon with auto-restart
services:
  scrappy:
    build: .
    volumes:
      - ./data:/out
    command: scrape --sites linkedin,indeed,remoteok \
                    --search "software engineer" --location "Remote" \
                    --results-wanted 1000 --format jsonl --out /out/jobs.jsonl
    environment:
      - SCRAPPY_PROXIES=${SCRAPPY_PROXIES:-}
      - SCRAPPY_RETRIES=3

  scrappy-scheduled:
    build: .
    profiles: ["scheduled"]
    restart: unless-stopped
    volumes:
      - ./data:/out
    command: scrape --sites linkedin,indeed,remoteok \
                    --search "software engineer" --location "Remote" \
                    --results-wanted 1000 --format jsonl --out /out/jobs.jsonl \
                    --dedup
    environment:
      - SCRAPPY_PROXIES=${SCRAPPY_PROXIES:-}
      - SCRAPPY_RETRIES=3
